[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news-aggregator"
version = "1.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests",
    "beautifulsoup4",
    "lxml",
    "openai",
    "python-dotenv",
    "python-multipart",
    "jinja2",
    "python-dateutil",
    "numpy",
    "scikit-learn",
    "sentence-transformers",
    "chromadb",
]

